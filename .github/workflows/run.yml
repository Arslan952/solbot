name: BTC Market Bot

on:
  schedule:
    # Hourly trigger + concurrency queue = the next session starts right after the
    # previous one ends (no 15+ minute gaps with unmanaged trades / unanswered commands).
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-market-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            btc_market_state.json
            btc_trade_log.csv
            btc_signal_log.jsonl
          key: btc-state-${{ github.run_id }}
          restore-keys: |
            btc-state-

      - name: Run BTC Market Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_SECONDS: "20700"
          REPORT_MODE: "short"
          CHART_WITH_REPORT: "0"
          LIQ_WS: "1"
          MAX_LEVERAGE: "3"
          SIGNAL_CONFIRM: "3"
        run: |
          python bot.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            btc_market_state.json
            btc_trade_log.csv
            btc_signal_log.jsonl
          key: btc-state-${{ github.run_id }}
