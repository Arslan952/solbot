# Save as: .github/workflows/btc_bot.yml
# Runs the bot in ~6h sessions, never two at once, and keeps its
# state (open trade, track record, cooldowns) between sessions.
name: BTC Market Bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: btc-market-bot        # never run two bots (they would fight over Telegram updates)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            btc_market_state.json
            btc_trade_log.csv
          key: btc-state-${{ github.run_id }}
          restore-keys: btc-state-

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional (Claude news summary)
          RUN_SECONDS: "20700"                                  # 345 min
        run: python btc_market_bot.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            btc_market_state.json
            btc_trade_log.csv
          key: btc-state-${{ github.run_id }}
