name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of 15m history to test"
        default: "180"
        required: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backtest
        env:
          DAYS: ${{ inputs.days }}
        run: python bot.py --backtest "$DAYS" | tee backtest_report.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            backtest_report.txt
            backtest_trades.csv
